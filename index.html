<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>THE GAME / Punta</title><style>body{margin:0;background:#101114;color:#f5f5f5;font:15px -apple-system,BlinkMacSystemFont,Arial}main{max-width:680px;margin:auto;padding:20px 16px 95px}h1{font-size:26px;margin:8px 0}small,.muted{color:#aaa}button,input,textarea,select{font:inherit;border-radius:12px;padding:12px;border:1px solid #414146;background:#222329;color:white}button{cursor:pointer}button.active,.primary{background:#e6c27a;color:#111;border-color:#e6c27a}nav{display:flex;gap:6px;position:sticky;top:0;background:#101114;padding:10px 0;z-index:2}nav button{flex:1;padding:10px 4px;font-size:13px}.card{background:#1b1c20;border:1px solid #35353b;border-radius:16px;padding:15px;margin:12px 0}h3{margin:0 0 8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tag{color:#e6c27a;font-size:12px}label{display:block;margin:12px 0 5px;color:#ccc}input,textarea,select{box-sizing:border-box;width:100%}textarea{min-height:85px}a{color:#e6c27a}p{line-height:1.5}.hide{display:none}.stat{font-size:24px;color:#e6c27a}</style></head><body><main><small>FIELD NOTES · PUNTA DEL ESTE / MALDONADO</small><h1>THE GAME <span class="muted">/ PUNTA</span></h1><nav><button data-tab="places" class="active">Места</button><button data-tab="plan">План</button><button data-tab="diary">Дневник</button><button data-tab="stats">Итоги</button></nav><section id="places"><p class="muted">Разведка заведений. Только Пунта и Мальдонадо. Проверяй часы работы перед выходом.</p><input id="search" placeholder="Найти место..."><div id="placeList"></div></section><section id="plan" class="hide"><h2>Запланировать выход</h2><label>Место</label><select id="planPlace"></select><label>Дата и время</label><input id="planDate" type="datetime-local"><label>Заметка</label><textarea id="planNote" placeholder="Что проверить?"></textarea><p><button class="primary" id="addPlan">Добавить в план</button></p><div id="planList"></div></section><section id="diary" class="hide"><h2>Записать посещение</h2><label>Место</label><select id="visitPlace"></select><label>Дата</label><input id="visitDate" type="date"><label>Оценка</label><select id="visitRating"><option value="5">5 — отлично</option><option value="4">4 — хорошо</option><option value="3">3 — нормально</option><option value="2">2 — так себе</option><option value="1">1 — плохо</option></select><label>Людей</label><select id="visitCrowd"><option>Много</option><option>Средне</option><option>Пусто</option></select><label>Знакомств</label><input id="visitContacts" type="number" min="0" value="0"><label>Расходы (UYU)</label><input id="visitCost" type="number" min="0" value="0"><label>Заметки</label><textarea id="visitNote" placeholder="Публика, атмосфера, лучшее время..."></textarea><p><button class="primary" id="addVisit">Сохранить посещение</button></p><div id="visitList"></div></section><section id="stats" class="hide"><h2>Итоги разведки</h2><div id="summary"></div><p><button id="exportData">Скачать резервную копию JSON</button></p><label>Восстановить резервную копию</label><input id="importData" type="file" accept="application/json"><p class="muted">Записи сохраняются только в этом браузере. Не удаляй данные Safari без резервной копии.</p></section></main><script>
const places=[["Moby Dick","Паб"],["Capi Bar","Бар"],["Soho","Ночной клуб"],["Zazú Puerto","Ресторан"],["Hippo Coffee Bar","Кафе"],["Parador Imarangatu","Пляжный ресторан"],["Beach House Roll and Rock","Ресторан"],["La Palma Gastro Bar","Гастробар"],["Casablanca","Социальный клуб"],["Parada 23","Пляж"],["KERO by Osaka","Азиатский ресторан"],["Ovo Beach","Временно закрыт"],["Ovo Nightclub","Закрыт навсегда"]];
const $=id=>document.getElementById(id),load=(key)=>{try{return JSON.parse(localStorage.getItem('tg_'+key))||[]}catch{return []}},save=(key,data)=>localStorage.setItem('tg_'+key,JSON.stringify(data));let plans=load('plans'),visits=load('visits');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('section').forEach(x=>x.classList.toggle('hide',x.id!==b.dataset.tab));render()}));
const opts=places.map(([n])=>'<option>'+esc(n)+'</option>').join('');$('planPlace').innerHTML=opts;$('visitPlace').innerHTML=opts;$('visitDate').value=new Date().toISOString().slice(0,10);
function render(){let q=$('search').value.toLowerCase();$('placeList').innerHTML=places.filter(([n,t])=>(n+' '+t).toLowerCase().includes(q)).map(([n,t])=>'<div class="card"><span class="tag">'+esc(t)+'</span><h3>'+esc(n)+'</h3><div class="row"><button data-visit="'+esc(n)+'">Записать визит</button><button data-plan="'+esc(n)+'">В план</button><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(n+' Punta del Este Uruguay')+'">На карте</a></div></div>').join('')||'<p>Ничего не найдено</p>';
$('planList').innerHTML='<h2>Мои планы</h2>'+(!plans.length?'<p class="muted">Пока пусто</p>':plans.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>'<div class="card"><h3>'+esc(x.place)+'</h3><p>'+esc(x.date.replace('T',' '))+'</p><p>'+esc(x.note)+'</p><button data-delplan="'+x.id+'">Удалить</button> <a href="'+calendarUrl(x)+'" target="_blank" rel="noopener">Google Calendar</a></div>').join(''));
$('visitList').innerHTML='<h2>История</h2>'+(!visits.length?'<p class="muted">Пока нет посещений</p>':visits.slice().reverse().map(x=>'<div class="card"><h3>'+esc(x.place)+' · '+esc(x.rating)+'/5</h3><small>'+esc(x.date)+' · '+esc(x.crowd)+'</small><p>'+esc(x.note)+'</p><p>Знакомств: '+esc(x.contacts)+' · '+esc(x.cost)+' UYU</p><button data-delvisit="'+x.id+'">Удалить</button></div>').join(''));
$('summary').innerHTML='<div class="card"><div class="stat">'+visits.length+'</div>Посещений</div><div class="card"><div class="stat">'+visits.reduce((a,x)=>a+Number(x.contacts||0),0)+'</div>Знакомств</div><div class="card"><div class="stat">'+visits.reduce((a,x)=>a+Number(x.cost||0),0)+' UYU</div>Расходы</div><div class="card"><div class="stat">'+(visits.length?(visits.reduce((a,x)=>a+Number(x.rating),0)/visits.length).toFixed(1):'—')+'</div>Средняя оценка</div>'}
function calendarUrl(x){let start=new Date(x.date);if(isNaN(start))return '#';let end=new Date(start.getTime()+60*60*1000);const fmt=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('THE GAME: '+x.place)+'&dates='+fmt(start)+'/'+fmt(end)+'&details='+encodeURIComponent(x.note||'Разведка заведения')+'&location='+encodeURIComponent(x.place+', Punta del Este, Uruguay')}
$('search').addEventListener('input',render);$('addPlan').onclick=()=>{if(!$('planDate').value)return alert('Выбери дату и время');plans.push({id:Date.now(),place:$('planPlace').value,date:$('planDate').value,note:$('planNote').value});save('plans',plans);$('planNote').value='';render()};$('addVisit').onclick=()=>{visits.push({id:Date.now(),place:$('visitPlace').value,date:$('visitDate').value,rating:$('visitRating').value,crowd:$('visitCrowd').value,contacts:$('visitContacts').value,cost:$('visitCost').value,note:$('visitNote').value});save('visits',visits);$('visitNote').value='';render()};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.visit){$('visitPlace').value=b.dataset.visit;document.querySelector('[data-tab="diary"]').click()}if(b.dataset.plan){$('planPlace').value=b.dataset.plan;document.querySelector('[data-tab="plan"]').click()}if(b.dataset.delplan){plans=plans.filter(x=>String(x.id)!==b.dataset.delplan);save('plans',plans);render()}if(b.dataset.delvisit){visits=visits.filter(x=>String(x.id)!==b.dataset.delvisit);save('visits',visits);render()}});
$('exportData').onclick=()=>{let blob=new Blob([JSON.stringify({plans,visits},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='the-game-punta-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importData').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.plans)||!Array.isArray(x.visits))throw Error('Неверный формат');if(!confirm('Заменить текущие записи данными из файла?'))return;plans=x.plans;visits=x.visits;save('plans',plans);save('visits',visits);render();alert('Восстановлено')}catch(err){alert('Ошибка: '+err.message)}};render();
</script></body></html>
